  spezial:
    image: node:22-alpine
    container_name: spezial
    restart: unless-stopped
    working_dir: /app
    command: ["node", "/app/server/spezial/dienst.mjs"]
    environment:
      SPEZIAL_DATEN: /daten
    volumes:
      - /srv/family-project:/app:ro
      - /srv/spezial:/daten
    logging: { driver: "json-file", options: { max-size: "1m", max-file: "2" } }
    expose: ["8080"]


name: Sporen lesen und Vektoren fortschreiben (täglich)

# Katalog-Spore Stufe 2 + 3. Einmal pro Nacht, EIN Lauf, EIN Bericht:
#   1. die hinterlegten Sporen der Anbieter lesen (Feld `sporeUrl` je Eintrag),
#   2. Beschreibungen übernehmen, WO Klaus es erlaubt hat (`sporeAuto: true`) —
#      sonst nur melden,
#   3. den Wächter über ALLE Zielseiten laufen lassen (erreichbar? Inhalt
#      geändert? von Hand gesperrt? von Safe Browsing gemeldet?) und das
#      Ergebnis als Ampel in denselben Bericht schreiben,
#   4. Lighthouse über die Zielseiten laufen lassen (Stufe 5, Weg A: auf
#      GitHubs Rechnern, NICHT über Googles PageSpeed-API — kein Schlüssel,
#      keine Adressliste an Google) und die vier Zahlen als `messung` in
#      denselben Bericht schreiben,
#   5. die vorberechneten Vektoren fortschreiben, mit derselben Spar-Logik wie
#      der Studio-Knopf: gerechnet wird nur, was sich geändert hat.
#
# Der Studio-Knopf bleibt daneben als Hand-Auslöser; beide schreiben dieselbe
# Datei nach demselben Vertrag.
#
# EHRLICH ÜBER DIE SCHICHT: Das hier ist Pilz-Schicht, kein Mycel. Ein benannter
# Server-Dienst fragt einmal am Tag öffentliche Dateien ab. Kein Crawler, keine
# Pulsation — der Knoten selbst bleibt Empfangsmodus.
#
# Warum ein Browser statt eines Node-Nachbaus: Gerechnet wird mit denselben
# Dateien, die auch markt.html lädt (sbkim/03_embedding.js, assets/vec-codec.js).
# Ein zweiter Rechenweg wäre eine zweite Wahrheit, die auseinanderläuft — und
# man merkt es erst an einem stillen, nutzlosen Paket.
#
# Der Lauf schreibt einmal täglich assets/config/spore-stand.json fort, auch
# wenn sich sonst nichts geändert hat. Das ist Absicht: der Zeitstempel darin
# ist der Beleg, DASS nachgesehen wurde. Ein Bericht, der stehen bleibt, wäre
# von einem ausgefallenen Lauf nicht zu unterscheiden.

on:
  schedule:
    - cron: "40 2 * * *"     # 02:40 UTC — nachts, außerhalb von Klaus' Arbeitszeit
  workflow_dispatch:          # und jederzeit von Hand: Actions -> Run workflow

permissions:
  contents: write

concurrency:
  group: vektoren-taeglich
  cancel-in-progress: false

jobs:
  vektoren:
    runs-on: ubuntu-latest
    # Stufe 5 misst je Eintrag rund eine halbe bis eine Minute; der Deckel in
    # tools/messung.mjs hält das bei höchstens zehn Einträgen je Nacht. Mit dem
    # Modell-Download davor bleibt eine Stunde reichlich Luft.
    timeout-minutes: 60
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Browser bereitstellen
        run: |
          set -euo pipefail
          npm install playwright --no-save
          npx playwright install --with-deps chromium

      # Stufe 5, Weg A. Schlägt die Installation fehl, bricht der Lauf NICHT ab:
      # ohne Lighthouse wird nicht gemessen, und der Bericht sagt ehrlich
      # „nicht gemessen" — genau wie der Safe-Browsing-Steckplatz ohne Schlüssel.
      # Eine ausgefallene Messung darf die nächtliche Arbeit nicht anhalten.
      - name: Lighthouse bereitstellen (Stufe 5, darf fehlschlagen)
        continue-on-error: true
        run: npm install lighthouse --no-save

      - name: Probelauf (ändert nichts, zeigt was anstünde; misst nicht)
        env:
          PW_CORE: playwright
        run: node tools/vektoren-bauen.mjs

      - name: Sporen lesen, Zielseiten bewachen, messen, Vektoren fortschreiben
        env:
          PW_CORE: playwright
          # Stufe 3, Steckplatz. Ist das Secret nicht gesetzt, ist die Variable
          # leer, es wird nicht bei Google gefragt, und der Bericht sagt ehrlich
          # „nicht geprüft" — der Rest des Wächters läuft unverändert weiter.
          # Zum Scharfschalten: Settings -> Secrets and variables -> Actions ->
          # New repository secret, Name SAFE_BROWSING_KEY.
          SAFE_BROWSING_KEY: ${{ secrets.SAFE_BROWSING_KEY }}
          # Stufe 5, Weg B (Klaus 2026-08-04): mit Schlüssel liefert Googles
          # PageSpeed Insights die Zahl — dieselbe Quelle wie der Bericht, auf
          # den das Bewertungs-Fenster verlinkt. Ohne Schlüssel wird weiter
          # selbst gemessen (Weg A); welcher Weg es war, steht danach im Feld
          # `quelle` und auf der Karte. Zum Scharfschalten: Settings -> Secrets
          # and variables -> Actions -> New repository secret, Name PSI_API_KEY.
          # Der Schlüssel ist bei Google kostenlos (PageSpeed Insights API).
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          set -euo pipefail
          # Lighthouse startet Chrome selbst. Auf ubuntu-latest liegt in der
          # Regel ein Google Chrome — ist er da, wird er genannt. Ist er NICHT
          # da, wird die Variable bewusst NICHT gesetzt: ein CHROME_PATH auf
          # eine Datei, die es nicht gibt, wäre schlimmer als gar keiner, weil
          # chrome-launcher dann nicht mehr selbst sucht.
          if [ -x /usr/bin/google-chrome ]; then
            export CHROME_PATH=/usr/bin/google-chrome
            echo "Chrome für die Messung: $CHROME_PATH"
          else
            echo "Kein /usr/bin/google-chrome — chrome-launcher sucht selbst"
          fi
          node tools/vektoren-bauen.mjs --schreiben

      - name: Ergebnis committen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Nur diese drei Dateien — nie versehentlich das Modell oder
          # node_modules. `git add <pfad>` statt `git add -A`.
          # wache-hand.json steht bewusst NICHT dabei: der Lauf liest sie nur.
          # Was von Hand gesperrt wird, entscheidet Klaus, nicht die Aktion.
          git add assets/config/listings-vec.json assets/config/listings.js assets/config/spore-stand.json
          if git diff --cached --quiet; then
            echo "Keine Änderung."
            exit 0
          fi
          UEB=$(git diff --cached --name-only | grep -c 'listings.js' || true)
          if [ "$UEB" -gt 0 ]; then
            git commit -m "Sporen gelesen: Beschreibung(en) übernommen, Vektoren fortgeschrieben"
          else
            git commit -m "Tägliche Aktualisierung: Sporen geprüft, Vektoren fortgeschrieben"
          fi
          git push origin HEAD:"${GITHUB_REF_NAME}"

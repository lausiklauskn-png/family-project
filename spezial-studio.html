  <link rel="stylesheet" href="assets/style.css?v=188" />
  <style>
    body{background:#0b1117} #spezialStudio{max-width:1240px;margin:24px auto;padding:0 16px}
    @media (min-width:1000px){#spezialStudio{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start} #spezialStudio>h2,#spezialStudio>.sps-schritte{grid-column:1/-1}}
    .sps-schritte{margin:0 0 4px;color:var(--muted)}
    .sps-teil{padding:0;margin:14px 0}
    .sps-teil>summary{list-style:none;cursor:pointer;padding:14px 20px;display:flex;align-items:center;gap:10px;min-height:44px;box-sizing:border-box} .sps-teil>summary::-webkit-details-marker{display:none}
    .sps-teil>summary::before{content:"▸";transition:transform .18s;opacity:.8} .sps-teil[open]>summary::before{transform:rotate(90deg)}
    .sps-teil>summary h3{margin:0;font-size:1.08rem} .sps-teil>summary:focus-visible{outline:3px solid var(--focus,#7c9cff);outline-offset:-3px;border-radius:inherit}
    .sps-inhalt{padding:0 20px 18px;display:flex;flex-direction:column;gap:10px}
    .sps-geladen{margin-top:4px;font-size:.8rem} .sps-geladen summary{cursor:pointer;color:var(--accent,#6ee7d3);white-space:nowrap} .sps-geladen ul{margin:4px 0 0;padding-left:1.1em} .sps-geladen li{white-space:nowrap}
    .sps-teil input[type=text],.sps-teil input[type=password],.sps-teil textarea{width:100%;box-sizing:border-box;padding:9px 11px;border-radius:10px;border:1px solid var(--line,#2a3442);background:rgba(255,255,255,.04);color:inherit;font:inherit}
    .sps-teil textarea{font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
    .sps-teil .btn{align-self:flex-start}
    .sps-pub{word-break:break-all;font-size:.8rem}
    .sps-apps{border:1px solid var(--line,#2a3442);border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
    .sps-klein{font-size:.82rem;color:var(--muted)} .sps-gut{color:#3fd18b} .sps-schlecht{color:#e8c14a}
    .sps-sym{width:22px;height:22px;border-radius:5px;vertical-align:-5px}
    .sps-meld{min-height:1.2em;margin:0}
    .sps-tab{width:100%;border-collapse:collapse;font-size:.86rem} .sps-tab td,.sps-tab th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line,#2a3442);vertical-align:top}
    .sps-knoepfe{display:flex;flex-direction:column;gap:6px;width:13.5em;max-width:100%} .sps-knoepfe .btn{width:100%;margin:0;justify-content:center;text-align:center;padding:7px 10px;font-size:.84rem} .sps-zu{font-size:.78rem;opacity:.8;text-align:center}
    .sps-ueb{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line,#2a3442);padding-top:12px} .sps-ueb[hidden]{display:none}
    .sps-reihe{display:flex;flex-wrap:wrap;gap:8px} .sps-link{word-break:break-all}
    .sps-code{font-size:1.3rem;margin:0} .sps-code strong{font-family:ui-monospace,Menlo,monospace;letter-spacing:.1em}
    .sps-qr img{width:240px;height:auto;border-radius:14px;display:block;margin-bottom:8px} .sps-voll{grid-column:1/-1;margin:4px 0 0}
  </style>
